name: eval-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  dev-set:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: adjudicate
        ports: ["55491:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADJUDICATE_TOKEN_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.23"
      - run: uv sync --frozen
      - run: psql "postgresql://postgres:postgres_dev_pw@localhost:55491/adjudicate" -f db/init/01-roles.sql
      - run: uv run poe seed --accounts 2
      - run: uv run python -m evals.runner --llm anthropic --budget-usd 10
      - run: uv run python -m evals.gate "$(ls -td evals/results/*/ | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
