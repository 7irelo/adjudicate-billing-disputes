name: ci
on:
  push:
    branches: ['**']
  pull_request:

env:
  ADJUDICATE_TOKEN_SECRET: ci-only-secret-ci-only-secret-ci-only-secret

jobs:
  free:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: adjudicate
        ports: ["55491:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.23"
      - run: uv sync --frozen
      - name: Create roles
        run: psql "postgresql://postgres:postgres_dev_pw@localhost:55491/adjudicate" -f db/init/01-roles.sql
      - run: uv run poe lint
      - run: uv run poe types
      - run: uv run pytest -m "not llm" -q
      - name: Mutation check proves the isolation suite can fail
        run: uv run poe mutation-check
      - name: Seed the world
        run: uv run poe seed --accounts 2
      - name: Oracle run must pass the gate
        run: |
          uv run python -m evals.runner --llm oracle
          uv run python -m evals.gate "$(ls -td evals/results/*/ | head -1)"
      - name: Constant model must fail the gate
        run: |
          uv run python -m evals.runner --llm constant
          ! uv run python -m evals.gate "$(ls -td evals/results/*/ | head -1)"
      - name: Retrieval eval, BM25 only
        run: uv run python -m evals.retrieval_eval --split dev --modes bm25

  smoke:
    # A paid run. Fork PRs have no secrets, so they only ever get the free job.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'eval')
    needs: free
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: adjudicate
        ports: ["55491:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.23"
      - run: uv sync --frozen
      - run: psql "postgresql://postgres:postgres_dev_pw@localhost:55491/adjudicate" -f db/init/01-roles.sql
      - run: uv run poe seed --accounts 2
      - run: uv run python -m evals.runner --llm anthropic --limit 25 --budget-usd 4
      - run: uv run python -m evals.gate "$(ls -td evals/results/*/ | head -1)"
