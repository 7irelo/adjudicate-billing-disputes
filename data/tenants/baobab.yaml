tenant_id: baobab
name: Baobab Mobile
customer_type: consumer
proration: calendar_days
notice: {unit: business_days, count: 20}
rules:
  - rule_id: duplicate_reversal
    version: 1
    effective_from: 2025-01-01
    authorising_clauses: ["baobab-tcs-2025:billing:2.3", "baobab-tcs-2026:billing:2.3"]
    method: duplicate_reversal
    auto_credit_limit_cents: 100000
    dispute_window_days: 90
  - rule_id: duplicate_reversal
    version: 2
    effective_from: 2026-04-01
    authorising_clauses: ["baobab-tcs-2026:billing:2.3"]
    method: duplicate_reversal
    auto_credit_limit_cents: 100000
    dispute_window_days: 60
  - rule_id: rerate_difference
    version: 1
    effective_from: 2025-01-01
    authorising_clauses: ["baobab-tcs-2025:billing:2.4", "baobab-tcs-2026:billing:2.4"]
    method: rerate_difference
    line_types: [usage_local, usage_international, usage_roaming, usage_oob]
    auto_credit_limit_cents: 100000
    dispute_window_days: 90
  - rule_id: oob_without_consent
    version: 1
    effective_from: 2025-01-01
    authorising_clauses: ["baobab-tcs-2025:out_of_bundle:3.2", "baobab-tcs-2026:out_of_bundle:3.2"]
    method: reversal_without_consent
    line_types: [usage_oob]
    consent_kind: oob_opt_in
    auto_credit_limit_cents: 100000
    dispute_window_days: 90
  - rule_id: roaming_without_activation
    version: 1
    effective_from: 2025-01-01
    authorising_clauses: ["baobab-tcs-2025:roaming:6.2", "baobab-tcs-2026:roaming:6.2"]
    method: reversal_without_consent
    line_types: [usage_roaming]
    consent_kind: roaming_activation
    auto_credit_limit_cents: 100000
    dispute_window_days: 90
  - rule_id: bill_shock_over_cap
    version: 1
    effective_from: 2025-01-01
    effective_to: 2026-03-31
    authorising_clauses: ["baobab-tcs-2025:spend_protection:4.3"]
    method: bill_shock_over_cap
    line_types: [usage_local, usage_international, usage_roaming, usage_oob]
    cap_cents: 50000
    auto_credit_limit_cents: 100000
    dispute_window_days: 90
  - rule_id: bill_shock_over_cap
    version: 2
    effective_from: 2026-04-01
    authorising_clauses: ["baobab-tcs-2026:spend_protection:4.3"]
    method: bill_shock_over_cap
    line_types: [usage_local, usage_international, usage_roaming, usage_oob]
    cap_cents: 75000
    auto_credit_limit_cents: 100000
    dispute_window_days: 60
  - rule_id: post_cancellation_proration
    version: 1
    effective_from: 2025-01-01
    authorising_clauses: ["baobab-tcs-2025:cancellation:5.3", "baobab-tcs-2026:cancellation:5.3"]
    method: post_cancellation_proration
    proration: calendar_days
    line_types: [recurring]
    auto_credit_limit_cents: 100000
    dispute_window_days: 90
